name: ClinicFlow AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Monorepo Root Dependencies
      run: npm install

    - name: Install & Compile Backend
      run: |
        npm install --prefix backend
        npm run build --prefix backend

    - name: Install & Compile Frontend
      run: |
        npm install --legacy-peer-deps --prefix frontend
        npm run build --prefix frontend
